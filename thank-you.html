<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank You — Stratfor Capital</title>
<meta name="description" content="Your inquiry has been received. Stratfor Capital will respond within 24 hours.">
<meta name="robots" content="noindex,follow">
<link rel="canonical" href="https://stratforcapital.com/thank-you">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--cream:#faf7f2;--white:#ffffff;--navy:#0b1a3a;--text:#3a4256;--text-soft:#6b7280;--gold:#d4af37;--gold-text:#8a6d21;--border:#e7e0d0;--shadow:0 10px 30px rgba(11,26,58,.08)}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--cream);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;text-align:center;line-height:1.6}
.mark{width:80px;height:80px;border-radius:50%;background:var(--gold);color:var(--navy);display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:700;margin-bottom:28px}
h1{color:var(--navy);font-size:38px;margin-bottom:14px;max-width:640px}
p{color:var(--text-soft);font-size:17px;max-width:560px;margin-bottom:12px}
.meta{margin-top:24px;background:var(--white);border:1px solid var(--border);box-shadow:var(--shadow);padding:22px 26px;border-radius:10px;max-width:420px;width:100%}
.meta b{color:var(--gold-text);display:block;font-size:12px;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
.meta a{color:var(--navy);text-decoration:none;font-size:16px}
.meta div{margin-bottom:14px}
.meta div:last-child{margin-bottom:0}
.actions{margin-top:32px;display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.btn{padding:12px 22px;border-radius:6px;text-decoration:none;font-weight:700;font-size:15px}
.btn-primary{background:var(--gold);color:var(--navy)}
.btn-secondary{background:transparent;color:var(--gold-text);border:1px solid var(--gold)}
</style>
</head>
<body>
  <div class="mark">✓</div>
  <h1>Thank you — your inquiry has been received</h1>
  <p>We've received your message and will respond within 24 hours. For time-sensitive matters, call or text directly.</p>
  <div class="meta">
    <div><b>Phone</b><a href="tel:+17804661203">780-466-1203</a></div>
    <div><b>Email</b><a href="mailto:info@stratforcapital.com">info@stratforcapital.com</a></div>
    <div><b>Response Time</b><span style="color:var(--navy)">Within 24 hours</span></div>
  </div>
  <div class="actions">
    <a class="btn btn-primary" href="/">Back to Home</a>
    <a class="btn btn-secondary" href="/card">View Digital Card</a>
  </div>
  <p style="margin-top:24px;font-size:12px"><a href="/privacy" style="color:var(--text-soft)">Privacy</a> &middot; <a href="/terms" style="color:var(--text-soft)">Terms</a></p>
</body>
</html>
